name: Daily Leaderboard Update and Deploy

on:
  schedule:
    - cron: '0 4 * * *' # Runs every day at 04:00 UTC
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/daily_leaderboard_update.yml']
  workflow_dispatch:

permissions:
  contents: write # commit new snapshots
  pages: write    # deploy to GitHub Pages
  id-token: write # required by actions/deploy-pages

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch and Save Daily Snapshot
        run: python fetch_daily_snapshot.py

      - name: Commit New Snapshot
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Automated update: daily leaderboard snapshot"
          file_pattern: "data/"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
          commit_author: "GitHub Actions Bot <actions@github.com>"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Build Site
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
